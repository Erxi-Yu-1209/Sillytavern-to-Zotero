services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}

  litellm:
    image: docker.litellm.ai/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./apiconfig.env
    environment:
      - LOG_LEVEL=INFO
      - LOCAL_LLAMA_BASE_DOCKER=${LOCAL_LLAMA_BASE_DOCKER:-http://host.docker.internal:8080/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    command: python -m litellm.proxy.proxy --config /app/config.yaml --port 4000
    depends_on:
      - qdrant

volumes:
  qdrant_storage:
    driver: local
